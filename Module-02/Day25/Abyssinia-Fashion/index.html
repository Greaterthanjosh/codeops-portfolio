<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Abyssinia Fashion - Ethiopian-inspired women's, men's, and children's fashion."
    />

    <title>Abyssinia Fashion</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <h1>Abyssinia Fashion</h1>

      <!-- Main Navigation -->
      <nav aria-label="Main navigation">
        <a href="#" data-category=""> All Products </a>

        <a href="#" data-category="Women's Fashion"> Women's Fashion </a>

        <a href="#" data-category="Men's Fashion"> Men's Fashion </a>

        <a href="#" data-category="Baby & Kids Fashion">
          Baby & Kids Fashion
        </a>
      </nav>

      <!-- Search Form -->
      <form id="search-form">
        <label for="search"> Search products </label>

        <input
          type="search"
          id="search"
          placeholder="Search for fashion items..."
          autocomplete="off"
        />
      </form>

      <!-- Cart Button -->
      <button id="cart-button" type="button">
        Cart (<span id="cart-count">0</span>)
      </button>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Products Section -->
      <section id="products-section" aria-labelledby="products-heading">
        <h2 id="products-heading">Shop Fashion Items</h2>

        <div id="products" aria-live="polite"></div>
      </section>

      <!-- Shopping Cart -->
      <aside id="cart" aria-label="Shopping Cart">
        <h2>Your Cart</h2>

        <ul id="cart-items"></ul>

        <p>
          Total:
          <span id="cart-total">0 ETB</span>
        </p>

        <button id="checkout-button" type="button">Checkout</button>
      </aside>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 Abyssinia Fashion. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="app.js"></script>
  </body>
</html>
